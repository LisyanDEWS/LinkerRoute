<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkerRoute</title>

    <!-- COEP/COOP are set via server headers, but these meta tags ensure
         the page is cross-origin-isolated before any JS runs -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

    <!-- Theme bridge: applies M3 CSS variables from parent postMessage -->
    <script src="/theme.js"></script>

    <!-- Scramjet proxy engine -->
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="/register-sw.js" defer></script>
    <script src="/search.js" defer></script>
    <script src="/index.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ── M3 Expressive base — all colors via var(--*) set by theme.js ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--on-surface);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ── Sidebar ── */
        aside {
            width: 240px;
            background: var(--surface-dim);
            border-right: 1px solid var(--outline-var);
            display: flex;
            flex-direction: column;
            z-index: 50;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .brand {
            padding: 20px 22px;
            font-weight: 900;
            font-size: 18px;
            color: var(--on-surface);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-tertiary));
            box-shadow: 0 0 12px var(--accent);
        }

        #tab-list {
            flex: 1;
            padding: 4px 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #tab-list::-webkit-scrollbar { width: 4px; }
        #tab-list::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 4px; }

        .tab {
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.18s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid transparent;
            color: var(--on-surface-var);
            font-size: 13px;
            font-weight: 500;
            position: relative;
        }
        .tab:hover {
            background: var(--container);
            color: var(--on-surface);
        }
        .tab.active {
            background: var(--container-high);
            border-color: var(--outline);
            color: var(--on-surface);
        }
        .tab.active::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 3px; height: 16px;
            border-radius: 0 3px 3px 0;
            background: var(--accent);
        }

        .tab-icon {
            width: 18px; height: 18px;
            border-radius: 6px;
            object-fit: contain;
            flex-shrink: 0;
            background: var(--surface);
        }
        .tab-icon-letter {
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: var(--on-accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-tertiary));
        }
        .tab-icon-letter::after {
            content: attr(data-letter);
        }
        .tab-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-close {
            opacity: 0;
            font-size: 14px;
            transition: all 0.15s;
            color: var(--on-surface-var);
            line-height: 1;
            padding: 2px 4px;
            border-radius: 6px;
        }
        .tab:hover .tab-close { opacity: 0.6; }
        .tab-close:hover { opacity: 1; color: #ef4444; background: rgba(239,68,68,0.1); }

        .new-tab-btn {
            margin: 10px;
            padding: 11px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border: none;
            border-radius: 14px;
            color: var(--on-accent);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .new-tab-btn:hover { transform: scale(1.02); box-shadow: var(--shadow-2); }
        .new-tab-btn:active { transform: scale(0.98); }

        /* ── Sidebar footer (settings) ── */
        .sidebar-footer {
            padding: 8px;
            border-top: 1px solid var(--outline-var);
            display: flex;
            gap: 4px;
        }
        .sidebar-footer-btn {
            flex: 1;
            padding: 9px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--on-surface-var);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .sidebar-footer-btn:hover {
            background: var(--container);
            color: var(--on-surface);
        }

        /* ── Compact tab mode ── */
        body.compact-tabs .tab {
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            gap: 8px;
        }
        body.compact-tabs .tab-icon {
            width: 16px; height: 16px;
            border-radius: 5px;
        }
        body.compact-tabs .tab-icon-letter { font-size: 9px; }
        body.compact-tabs .new-tab-btn { padding: 8px; font-size: 12px; }
        body.compact-tabs #tab-list { gap: 1px; padding: 2px 6px; }

        /* ── Settings modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 28px;
            width: 480px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-2);
            transform: scale(0.95);
            transition: transform 0.2s cubic-bezier(0.2,0,0,1);
        }
        .modal-overlay.open .modal { transform: scale(1); }
        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 6px; }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--on-surface);
            letter-spacing: -0.02em;
        }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--on-surface-var);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .modal-close:hover { background: var(--container-high); color: var(--on-surface); }

        .modal-body { padding: 16px 24px 24px; }

        .settings-section {
            margin-bottom: 24px;
        }
        .settings-section:last-child { margin-bottom: 0; }
        .settings-section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--on-surface-var);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--outline-var);
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-row-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--on-surface);
        }
        .settings-row-desc {
            font-size: 12px;
            color: var(--on-surface-var);
            margin-top: 2px;
        }

        /* ── Toggle switch (M3) ── */
        .toggle {
            position: relative;
            width: 44px; height: 24px;
            flex-shrink: 0;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--surface-dim);
            border: 2px solid var(--outline);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            left: 4px; top: 50%;
            transform: translateY(-50%);
            border-radius: 50%;
            background: var(--outline);
            transition: all 0.2s;
        }
        .toggle input:checked + .toggle-slider {
            background: var(--accent);
            border-color: var(--accent);
        }
        .toggle input:checked + .toggle-slider::before {
            left: 22px;
            width: 18px; height: 18px;
            background: var(--on-accent);
        }

        /* ── Danger button ── */
        .btn-danger {
            width: 100%;
            padding: 12px 16px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 14px;
            color: #ef4444;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); }
        .btn-danger:active { transform: scale(0.98); }

        .btn-primary {
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            color: var(--on-accent);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary:hover { transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.98); }

        /* ── Quick links editor ── */
        .ql-editor { display: flex; flex-direction: column; gap: 8px; }
        .ql-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: var(--surface-dim);
            border: 1px solid var(--outline-var);
            border-radius: 12px;
        }
        .ql-letter {
            width: 32px; height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--on-accent);
            flex-shrink: 0;
            cursor: pointer;
            border: none;
            text-align: center;
        }
        .ql-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--on-surface);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            padding: 4px;
        }
        .ql-input.name { max-width: 100px; font-weight: 600; }
        .ql-input.url { font-size: 11px; color: var(--on-surface-var); }
        .ql-remove {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--on-surface-var);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.15s;
        }
        .ql-remove:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
        .ql-add {
            padding: 8px;
            background: transparent;
            border: 1px dashed var(--outline);
            border-radius: 12px;
            color: var(--on-surface-var);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .ql-add:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Main area ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* ── Top toolbar ── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--outline-var);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .nav-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--on-surface-var);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.15s;
        }
        .nav-btn:hover {
            background: var(--container-high);
            color: var(--on-surface);
        }
        .nav-btn:active { transform: scale(0.9); }
        .nav-btn:disabled {
            color: var(--outline);
            cursor: not-allowed;
            opacity: 0.5;
        }
        .nav-btn:disabled:hover {
            background: transparent;
            color: var(--outline);
        }
        .nav-btn:disabled:active { transform: none; }

        .url-box {
            flex: 1;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }
        .url-input {
            width: 100%;
            background: var(--surface-dim);
            border: 1px solid var(--outline-var);
            padding: 9px 18px;
            border-radius: 24px;
            color: var(--on-surface);
            outline: none;
            text-align: center;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }
        .url-input::placeholder { color: var(--on-surface-var); }
        .url-input:focus {
            border-color: var(--accent);
            border-radius: 16px;
            text-align: left;
        }

        /* ── Viewport ── */
        #viewport {
            flex: 1;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        .view {
            position: absolute;
            inset: 0;
            display: none;
        }
        .view.active { display: block; }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* ── Dashboard (new tab page) ── */
        .dash {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 24px;
            transition: background 0.3s ease;
        }

        .dash-logo {
            width: 56px; height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: var(--shadow-2);
        }
        .dash-logo svg {
            width: 28px; height: 28px;
            color: var(--on-accent);
        }

        .dash-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--on-surface);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }
        .dash-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: var(--on-surface-var);
            margin-bottom: 28px;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }

        .q-link {
            padding: 16px 8px;
            background: var(--surface);
            border: 1px solid var(--outline-var);
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .q-link:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: var(--shadow-1);
        }
        .q-link:active { transform: scale(0.97); }

        .q-link-icon {
            width: 36px; height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: var(--on-accent);
        }
        .q-link-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* ── Loading state ── */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.2s;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--outline);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Status badge ── */
        .status-badge {
            position: fixed;
            bottom: 12px; right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--outline-var);
            font-size: 10px;
            font-weight: 700;
            color: var(--on-surface-var);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: var(--shadow-1);
            z-index: 100;
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <aside>
        <div class="brand">
            <span class="brand-dot"></span>
            LinkerRoute
        </div>
        <div id="tab-list"></div>
        <button class="new-tab-btn" onclick="createTab()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New Tab
        </button>
        <div class="sidebar-footer">
            <button class="sidebar-footer-btn" onclick="openSettings()" title="Settings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </button>
        </div>
    </aside>

    <main>
        <div class="top-bar">
            <button class="nav-btn" id="nav-back" onclick="triggerNav('back')" title="Back" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <button class="nav-btn" id="nav-forward" onclick="triggerNav('forward')" title="Forward" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <button class="nav-btn" id="nav-reload" onclick="triggerNav('reload')" title="Reload" disabled>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
            <div class="url-box">
                <form id="proxy-form">
                    <input id="proxy-address" class="url-input" type="text" placeholder="Search or enter URL" autocomplete="off" />
                </form>
            </div>
        </div>
        <div id="viewport"></div>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="modal-close" onclick="closeSettings()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <!-- Appearance -->
                <div class="settings-section">
                    <div class="settings-section-title">Appearance</div>
                    <div class="settings-row">
                        <div>
                            <div class="settings-row-label">Compact tabs</div>
                            <div class="settings-row-desc">Smaller tab height in the sidebar</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" id="setting-compact" onchange="toggleCompactTabs()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <!-- New Tab -->
                <div class="settings-section">
                    <div class="settings-section-title">New Tab Quick Links</div>
                    <div class="ql-editor" id="ql-editor"></div>
                    <button class="ql-add" onclick="addQuickLink()" style="margin-top:8px;">
                        + Add quick link
                    </button>
                </div>

                <!-- Privacy -->
                <div class="settings-section">
                    <div class="settings-section-title">Privacy & Data</div>
                    <div class="settings-row">
                        <div>
                            <div class="settings-row-label">Clear browsing data</div>
                            <div class="settings-row-desc">Deletes cookies, cache, and site data for all proxied pages</div>
                        </div>
                    </div>
                    <button class="btn-danger" onclick="clearBrowsingData()" style="margin-top:12px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        Clear all browsing data
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
