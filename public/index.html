<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Web</title>

    <!-- COEP/COOP headers for proxy isolation -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />

    <!-- Scramjet proxy engine & transports -->
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="/register-sw.js" defer></script>
    <script src="/index.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        /* ── Fullscreen Viewport ── */
        #viewport {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 10;
            overflow: hidden;
        }

        /* ── Minimalist Fullscreen Loader ── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 40;
            opacity: 1;
            transition: opacity 0.35s ease;
            pointer-events: auto;
        }

        #loading-overlay:not(.visible) {
            opacity: 0;
            pointer-events: none;
        }

        .m3-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 15px;
            font-weight: 600;
            color: #f4f4f5;
            letter-spacing: -0.01em;
        }

        .loading-detail {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: #71717a;
        }

        /* ── Discreet Top-Right Reload Helper (Hover Only) ── */
        #floating-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(-4px);
        }

        body:hover #floating-controls,
        #floating-controls:hover {
            opacity: 0.85;
            pointer-events: auto;
            transform: translateY(0);
        }

        .reload-btn {
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #a1a1aa;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 9999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: all 0.15s ease;
        }

        .reload-btn:hover {
            background: #27272e;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Minimalist Loading Overlay -->
    <div id="loading-overlay" class="visible">
        <div class="m3-spinner"></div>
        <div class="loading-title">Launching Telegram Web...</div>
        <div class="loading-detail">web.telegram.org/a/</div>
    </div>

    <!-- Fullscreen Iframe Viewport -->
    <div id="viewport"></div>

    <!-- Discreet top-right floating reload control -->
    <div id="floating-controls">
        <button class="reload-btn" onclick="reloadActiveFrame()" title="Reload Telegram">
            <span class="material-symbols-rounded" style="font-size:14px;">refresh</span>
            <span>Reload</span>
        </button>
    </div>

</body>
</html>
