<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Web</title>

    <!-- COEP/COOP headers for proxy isolation -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />

    <!-- Polyfill navigator.serviceWorker if running on unsecure LAN origin to prevent BareMux crash -->
    <script>
        if (typeof navigator !== 'undefined' && !navigator.serviceWorker) {
            try {
                Object.defineProperty(navigator, 'serviceWorker', {
                    value: {
                        addEventListener: function() {},
                        removeEventListener: function() {},
                        dispatchEvent: function() { return true; },
                        register: function() {
                            return Promise.reject(new Error("ServiceWorker requires HTTPS, localhost, or 127.0.0.1"));
                        },
                        ready: new Promise(function() {})
                    },
                    configurable: true,
                    writable: true
                });
            } catch (e) {
                console.warn("ServiceWorker polyfill notice:", e);
            }
        }
    </script>

    <!-- Scramjet proxy engine & transports -->
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="/register-sw.js" defer></script>
    <script src="/index.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        /* ── Fullscreen Viewport ── */
        #viewport {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 10;
            overflow: hidden;
        }

        /* ── Minimalist Fullscreen Loader ── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 40;
            opacity: 1;
            transition: opacity 0.35s ease;
            pointer-events: auto;
            padding: 24px;
            text-align: center;
        }

        #loading-overlay:not(.visible) {
            opacity: 0;
            pointer-events: none;
        }

        .m3-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 15px;
            font-weight: 600;
            color: #f4f4f5;
            letter-spacing: -0.01em;
        }

        .loading-detail {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: #71717a;
            max-width: 500px;
            word-break: break-word;
        }

        .warning-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 20px;
            max-width: 520px;
            text-align: left;
            margin-top: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .warning-title {
            font-size: 14px;
            font-weight: 700;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .warning-text {
            font-size: 13px;
            line-height: 1.5;
            color: #d4d4d8;
            margin-bottom: 14px;
        }

        .action-link {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .action-link:hover {
            background: #2563eb;
        }

        /* ── Discreet Top-Right Reload Helper (Hover Only) ── */
        #floating-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(-4px);
        }

        body:hover #floating-controls,
        #floating-controls:hover {
            opacity: 0.85;
            pointer-events: auto;
            transform: translateY(0);
        }

        .reload-btn {
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #a1a1aa;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 9999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: all 0.15s ease;
        }

        .reload-btn:hover {
            background: #27272e;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Minimalist Loading Overlay -->
    <div id="loading-overlay" class="visible">
        <div id="spinner-container" class="m3-spinner"></div>
        <div id="loading-title" class="loading-title">Launching Telegram Web...</div>
        <div id="loading-detail" class="loading-detail">web.telegram.org/a/</div>
        <div id="untrusted-origin-warning" style="display: none;"></div>
    </div>

    <!-- Fullscreen Iframe Viewport -->
    <div id="viewport"></div>

    <!-- Discreet top-right floating reload control -->
    <div id="floating-controls">
        <button class="reload-btn" onclick="reloadActiveFrame()" title="Reload Telegram">
            <span class="material-symbols-rounded" style="font-size:14px;">refresh</span>
            <span>Reload</span>
        </button>
    </div>

</body>
</html>
