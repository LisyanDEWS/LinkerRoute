<!doctype html>
<html data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
		<title>LinkerRoute | Error</title>
		<base href="/" />
		<link rel="shortcut icon" content="favicon.ico" />
		<script src="/theme.js"></script>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
		<style>
			body {
				font-family: 'Inter', system-ui, sans-serif;
				margin: 0;
				background: var(--bg);
				color: var(--on-surface);
				display: flex;
				flex-direction: column;
				min-height: 100vh;
				padding: 32px;
			}
			.logo-wrapper { margin-bottom: 16px; }
			.logo-wrapper h1 {
				font-size: 28px;
				font-weight: 900;
				letter-spacing: -0.03em;
				color: var(--on-surface);
			}
			.desc { margin-bottom: 24px; }
			.desc p {
				font-size: 14px;
				color: var(--on-surface-var);
				max-width: 480px;
				line-height: 1.6;
			}
			footer {
				margin-top: auto;
				display: flex;
				gap: 16px;
				padding-top: 20px;
				border-top: 1px solid var(--outline-var);
			}
			footer a, footer span {
				font-size: 12px;
				font-weight: 600;
				color: var(--on-surface-var);
				text-decoration: none;
			}
			footer a:hover { color: var(--accent); }
		</style>
	</head>
	<body>
		<div class="logo-wrapper">
			<h1>LinkerRoute | Error</h1>
		</div>
		<div class="desc">
			<p>The server could not route your request.</p>
		</div>
		<footer>
			<a title="License information" href="credits.html">Credits</a>
			<span>Powered by Scramjet</span>
		</footer>
	</body>
</html>
