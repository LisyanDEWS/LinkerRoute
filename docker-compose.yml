services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      WORKERS: ${WORKERS:-auto}
      MAX_WORKERS: ${MAX_WORKERS:-8}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      TRUST_PROXY: "true"
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-1000}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-100}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    expose:
      - "8080"
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
