# Optional self-hosted reverse proxy. Railway already provides an equivalent
# public ingress, TLS termination, WebSocket support, and connection handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=linkerroute_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=linkerroute_conn:10m;

upstream linkerroute_app {
    server app:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    client_header_timeout 30s;
    keepalive_timeout 10s;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://linkerroute_app/health;
        proxy_buffering off;
    }

    location ^~ /wisp/ {
        limit_conn linkerroute_conn 100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass http://linkerroute_app;
    }

    location ^~ /scram/ {
        proxy_set_header Connection "";
        proxy_pass http://linkerroute_app;
    }

    location ^~ /libcurl/ {
        proxy_set_header Connection "";
        proxy_pass http://linkerroute_app;
    }

    location ^~ /baremux/ {
        proxy_set_header Connection "";
        proxy_pass http://linkerroute_app;
    }

    location / {
        limit_req zone=linkerroute_rate burst=50 nodelay;
        limit_conn linkerroute_conn 100;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://linkerroute_app;
    }
}
